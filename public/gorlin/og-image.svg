<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background: warm cream -->
  <rect width="1200" height="630" fill="#FDF2E9"/>

  <!-- Editorial accent: full-bleed teal block on the left (RTL = visual right would be more natural; we use left for LTR social-card readers) -->
  <rect x="820" y="0" width="380" height="630" fill="#134E4A"/>

  <!-- DNA helix decorative on the teal block -->
  <g transform="translate(960 130)" fill="none" stroke="#FDF2E9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M0 30 C 60 30 60 100 0 100 S -60 170 0 170 S 60 240 0 240 S -60 310 0 310"/>
    <path d="M0 30 C -60 30 -60 100 0 100 S 60 170 0 170 S -60 240 0 240 S 60 310 0 310"/>
    <line x1="-22" y1="50" x2="22" y2="50"/>
    <line x1="-22" y1="100" x2="22" y2="100"/>
    <line x1="-22" y1="170" x2="22" y2="170"/>
    <line x1="-22" y1="240" x2="22" y2="240"/>
    <line x1="-22" y1="290" x2="22" y2="290"/>
    <line x1="-22" y1="340" x2="22" y2="340"/>
  </g>

  <!-- Title (Hebrew, RTL) — large -->
  <text x="780" y="240"
        font-family="'Noto Sans Hebrew', 'Assistant', 'Heebo', 'Arial Hebrew', sans-serif"
        font-size="92" font-weight="700"
        fill="#134E4A" text-anchor="end" direction="rtl">תסמונת גורלין</text>

  <!-- Subtitle -->
  <text x="780" y="310"
        font-family="'Assistant', 'Noto Sans Hebrew', sans-serif"
        font-size="38" font-weight="500"
        fill="#1C1917" text-anchor="end" direction="rtl">מאגר מידע מקיף בעברית</text>

  <!-- Audience badge row -->
  <g transform="translate(780 370)" font-family="'Dosis', 'Assistant', sans-serif" font-size="18" font-weight="700" fill="#FDF2E9" letter-spacing="2">
    <rect x="-180" y="0" width="180" height="42" fill="#134E4A"/>
    <text x="-90" y="28" text-anchor="middle">לחולים ומשפחות</text>
    <rect x="-380" y="0" width="180" height="42" fill="#0F3D3A"/>
    <text x="-290" y="28" text-anchor="middle">לרופאים</text>
    <rect x="-580" y="0" width="180" height="42" fill="#E11D48"/>
    <text x="-490" y="28" text-anchor="middle">לילדים</text>
  </g>

  <!-- Magazine rule -->
  <rect x="200" y="450" width="580" height="2" fill="#1C1917"/>

  <!-- Domain + tagline -->
  <text x="780" y="500"
        font-family="'Dosis', sans-serif"
        font-size="32" font-weight="600"
        fill="#1C1917" text-anchor="end" letter-spacing="3">GORLIN.HELP</text>

  <text x="780" y="540"
        font-family="'Assistant', sans-serif"
        font-size="22" font-weight="400"
        fill="#44403C" text-anchor="end" direction="rtl">NBCCS · גורלין-גולץ · עדכון מאי 2026</text>

  <!-- Author credit (small) -->
  <text x="780" y="595"
        font-family="'Assistant', sans-serif"
        font-size="16" font-weight="400"
        fill="#78716C" text-anchor="end" direction="rtl">נבנה ונערך על ידי עמית ברין · amitbrin.com</text>
</svg>
